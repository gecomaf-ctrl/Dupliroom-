<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DupliRoom - Arbitrage Duplicate</title>
    
    <!-- PWA Meta tags and icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/drlog.png" />
    <link rel="apple-touch-icon" href="/drlog.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DupliRoom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1A2A6C" />
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker enregistré avec succès, scope: ' + reg.scope);
            })
            .catch(function(err) {
              console.error('[PWA] Échec d\'enregistrement du Service Worker: ' + err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
